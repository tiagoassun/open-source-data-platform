# Apache Superset - BI / visualização (build da imagem antes do stack).
# Documentação completa: ./README.md
# Pré-requisito: postgres-metadata (superset_db), .env, rede externa data-net.

services:
  superset:
    build:
      context: .
      dockerfile: Dockerfile
    image: tiagoassun/superset:4.1.1
    container_name: superset
    restart: unless-stopped
    networks:
      - data-net
    ports:
      - "8088:8088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      POSTGRES_METADATA_USER: ${POSTGRES_METADATA_USER:-admin}
      POSTGRES_METADATA_PASSWORD: ${POSTGRES_METADATA_PASSWORD}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      PYTHONPATH: /app/pythonpath
    volumes:
      - /docker-data/superset:/app/superset_home
      - /docker-data/superset/pythonpath:/app/pythonpath
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  data-net:
    external: true
