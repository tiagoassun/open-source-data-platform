# Cloudflare Tunnel - exposição pública sem abrir portas no firewall.
# Documentação completa: ./README.md
# Pré-requisito: .env com CLOUDFLARE_TOKEN e rede externa data-net.

services:
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    restart: unless-stopped
    volumes:
      - /docker-data/cloudflare:/home/nonroot/.cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TOKEN}
    networks:
      - data-net

networks:
  data-net:
    external: true
