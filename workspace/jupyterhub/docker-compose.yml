# JupyterHub - workspace multi-usuário (NativeAuthenticator; build antes do stack).
# Documentação completa: ./README.md
# Pré-requisito: postgres-metadata (jupyterhub_db), .env, DOCKER_GID, imagem mega-jupyter, rede data-net.

services:
  jupyterhub:
    build:
      context: .
      dockerfile: Dockerfile.hub
    image: tiagoassun/jupyterhub-hub:5.2.1
    container_name: jupyterhub
    networks:
      - data-net
    restart: unless-stopped
    ports:
      - "8888:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /docker-data/jupyterhub:/srv/jupyterhub
    group_add:
      - "${DOCKER_GID:-983}"
    environment:
      JUPYTERHUB_CRYPT_KEY: ${JUPYTERHUB_CRYPT_KEY}
      DATABASE_URL: postgresql://${POSTGRES_METADATA_USER:-admin}:${POSTGRES_METADATA_PASSWORD}@postgres-metadata:5432/jupyterhub_db
      POSTGRES_METADATA_USER: ${POSTGRES_METADATA_USER:-admin}
      POSTGRES_METADATA_PASSWORD: ${POSTGRES_METADATA_PASSWORD}
      DOCKER_SPAWNER_HTTP_TIMEOUT: ${DOCKER_SPAWNER_HTTP_TIMEOUT:-600}
      JUPYTERHUB_HTTP_TIMEOUT: ${JUPYTERHUB_HTTP_TIMEOUT:-600}
      JUPYTERHUB_SPAWNER_IMAGE: ${JUPYTERHUB_SPAWNER_IMAGE:-tiagoassun/mega-jupyter:latest}
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/hub/login')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  data-net:
    external: true
