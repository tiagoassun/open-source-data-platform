# Apache Airflow - orquestração (LocalExecutor; build da imagem antes do stack).
# Documentação completa: ./README.md
# Pré-requisito: postgres-metadata (airflow_db), .env, DOCKER_GID, FERNET_KEY, rede data-net.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  image: tiagoassun/airflow:2.10.5
  user: "50000:0"
  restart: unless-stopped
  environment: &airflow-common-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_METADATA_USER:-admin}:${POSTGRES_METADATA_PASSWORD}@postgres-metadata:5432/airflow_db
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
    AIRFLOW__WEBSERVER__RBAC: "True"
    GIT_USER: ${GIT_USER:-}
    GIT_TOKEN: ${GIT_TOKEN:-}
  volumes:
    - /docker-data/airflow/dags:/opt/airflow/dags
    - /docker-data/airflow/logs:/opt/airflow/logs
    - /docker-data/airflow/plugins:/opt/airflow/plugins
    - /var/run/docker.sock:/var/run/docker.sock
  group_add:
    - "${DOCKER_GID:-983}"
  networks:
    - data-net

services:
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -euo pipefail
        airflow db migrate
        airflow users list | grep -q " ${AIRFLOW_ADMIN_USERNAME:-admin} " || \
          airflow users create \
            --username "${AIRFLOW_ADMIN_USERNAME:-admin}" \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email "${AIRFLOW_ADMIN_EMAIL}" \
            --password "${AIRFLOW_ADMIN_PASSWORD}"
        echo "Airflow init complete"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --allow-multiple --limit 5 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s

networks:
  data-net:
    external: true
