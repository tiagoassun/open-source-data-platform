# PostgreSQL Columnar (Hydra) - analytics / OLAP.
# Documentação completa: ./README.md
# Pré-requisito: .env (POSTGRES_*) e rede externa data-net.

services:
  postgres-columnar:
    image: ghcr.io/hydradatabase/hydra:16
    container_name: postgres-columnar
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
    volumes:
      - /docker-data/postgres-columnar:/var/lib/postgresql/data
    networks:
      - data-net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-analytics}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  data-net:
    external: true
