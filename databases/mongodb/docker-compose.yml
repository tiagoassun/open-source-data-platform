services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - /docker-data/mongodb:/data/db
    networks:
      - data-net
    ports:
      - "27017:27017"

networks:
  data-net:
    external: true