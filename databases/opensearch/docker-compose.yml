# OpenSearch - busca e indices (on-demand; exige vm.max_map_count no host).
# Documentação completa: ./README.md
# Pré-requisito: .env (OPENSEARCH_PASSWORD) e rede externa data-net.

services:
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "false"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD}
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - /docker-data/opensearch:/usr/share/opensearch/data
    networks:
      - data-net
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:$${OPENSEARCH_PASSWORD} https://localhost:9200/_cluster/health | grep -E '\"status\":\"(green|yellow)\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

networks:
  data-net:
    external: true
