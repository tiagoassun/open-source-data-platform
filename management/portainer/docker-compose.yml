# Portainer CE - gestão dos containers/stacks desta plataforma.
# Documentação completa: ./README.md
# Antes de subir: rede externa data-net.
# Sobe via CLI (não via Stack do próprio Portainer).

services:
  portainer:
    image: portainer/portainer-ce:2.27.9
    container_name: portainer
    restart: unless-stopped
    ports:
      - "8000:8000"   # Edge Agent (hosts remotos); opcional em host único
      - "9443:9443"   # UI HTTPS
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # controla o Docker deste host
      - /docker-data/portainer:/data                # usuários, stacks, settings
    networks:
      - data-net

networks:
  data-net:
    external: true
